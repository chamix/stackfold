name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish          # manual approval gate; must match the npm trusted-publisher config
    permissions:
      contents: read
      id-token: write                 # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # npm publish can't be cleanly undone: refuse tags that aren't on main.
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc      # 24 -> bundled npm >= 11.5.1 (required for OIDC)
          registry-url: https://registry.npmjs.org
          # no dependency cache on purpose: release jobs shouldn't trust restored caches

      - run: npm ci

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run build
      - run: npm test

      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next       # prerelease: never becomes "latest"
          else
            npm publish
          fi
