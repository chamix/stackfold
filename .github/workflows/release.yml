name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

jobs:
  publish:
    name: stage on npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Not the approval gate: a staged version is approved on npm, with 2FA.
    environment: npm-publish          # part of the trusted-publisher contract; must match the npm config
    permissions:
      contents: read
      id-token: write                 # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A released version can't be cleanly undone: refuse tags that aren't on main.
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc      # the bundled npm is checked by the next step
          registry-url: https://registry.npmjs.org
          # no dependency cache on purpose: release jobs shouldn't trust restored caches

      # Fail closed, before anything runs: no upgrading npm here, and no other way to release.
      - name: npm must support staged publishing
        run: |
          required=11.15.0
          current="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $current does not support staged publishing (needs >= $required)"
            exit 1
          fi

      - run: npm ci

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run build
      - run: npm test
      - run: npm run smoke:pack

      # Nothing is installable until a maintainer approves the staged version.
      # The dist-tag chosen here can't be changed afterwards.
      - name: Stage for approval on npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm stage publish --tag next       # prerelease: never becomes "latest"
          else
            npm stage publish
          fi

  # Separate job so the publish job keeps read-only repo access: only this one
  # holds contents: write, and it runs no package code (no npm ci/scripts).
  github-release:
    name: create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # A draft: the public announcement must not precede availability on the registry.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          # Notes = this version's section of CHANGELOG.md, if there is one.
          awk -v h="## [${version}]" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          flags=(--verify-tag --draft)
          publish_draft="gh release edit $GITHUB_REF_NAME --draft=false"
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          else
            publish_draft+=" --latest"   # run by hand: a draft can't be marked latest
          fi

          if grep -q '[^[:space:]]' notes.md; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes "${flags[@]}"
          fi

          {
            echo "### Pending manual steps for $GITHUB_REF_NAME"
            echo
            echo "1. Fetch the staged tarball: \`npm stage list stackfold\`, \`npm stage view <stage-id>\`, then \`npm stage download <stage-id>\`."
            echo "2. In an empty temporary folder, install it: \`npm install <path-to-the-downloaded-tgz>\`."
            echo "3. There, run the installed binary: \`npx --no-install stackfold --version\` and \`npx --no-install stackfold list\`."
            echo "4. Only if all of that works, approve it on npm (asks for 2FA): \`npm stage approve <stage-id>\`. Otherwise run \`npm stage reject <stage-id>\`, delete the draft release and fix."
            echo "5. Once npm shows it as available, publish the draft GitHub Release: \`$publish_draft\`."
          } >> "$GITHUB_STEP_SUMMARY"
