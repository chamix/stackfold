name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish          # manual approval gate; must match the npm trusted-publisher config
    permissions:
      contents: read
      id-token: write                 # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # npm publish can't be cleanly undone: refuse tags that aren't on main.
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc      # 24 -> bundled npm >= 11.5.1 (required for OIDC)
          registry-url: https://registry.npmjs.org
          # no dependency cache on purpose: release jobs shouldn't trust restored caches

      - run: npm ci

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run build
      - run: npm test

      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next       # prerelease: never becomes "latest"
          else
            npm publish
          fi

  # Separate job so the publish job keeps read-only repo access: only this one
  # holds contents: write, and it runs no package code (no npm ci/scripts).
  github-release:
    name: create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          # Notes = this version's section of CHANGELOG.md, if there is one.
          awk -v h="## [${version}]" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          flags=(--verify-tag)
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi

          if grep -q '[^[:space:]]' notes.md; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes "${flags[@]}"
          fi
